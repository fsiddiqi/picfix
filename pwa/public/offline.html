<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PicFix — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #121212;
      color: #fff;
      padding: 24px;
      text-align: center;
    }
    h1 { font-size: 24px; }
    p { color: #999; line-height: 1.5; }
    .icon { font-size: 48px; }
  </style>
</head>
<body>
  <div class="icon">📡</div>
  <h1>No Connection</h1>
  <p>PicFix needs an internet connection<br/>to load for the first time.</p>
  <p>Once loaded, previously captured photos<br/>are available offline.</p>
</body>
</html>
